name: medcore-hms

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medcore_hms}
      POSTGRES_USER: ${POSTGRES_USER:-medcore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medcore}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medcore} -d ${POSTGRES_DB:-medcore_hms}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local S3-compatible endpoint for dev/test only (docs/11-DECISIONS.md
  # D-015). Real AWS S3 remains the production target (D-012); the backend's
  # S3Service points at this via the optional S3_ENDPOINT env var, unset in
  # production so the AWS SDK talks to real S3 instead.
  localstack:
    image: localstack/localstack:3
    restart: unless-stopped
    environment:
      SERVICES: s3
      DEFAULT_REGION: ${AWS_REGION:-ap-south-1}
    ports:
      - "4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 15

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
      target: dev
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-medcore}:${POSTGRES_PASSWORD:-medcore}@postgres:5432/${POSTGRES_DB:-medcore_hms}
      REDIS_URL: redis://redis:6379
      # Container-network hostname, not localhost:4566 — .env's value (for the
      # native dev path) is overridden here the same way DATABASE_URL/REDIS_URL are.
      S3_ENDPOINT: http://localstack:4566
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
    volumes:
      - ./apps/backend/src:/workspace/apps/backend/src
    # NOTE: packages/ (e.g. @medcore/types) is baked into the image at build time,
    # not bind-mounted — rebuild the image (`docker compose build api`) after changing
    # a shared package. App source under apps/*/src hot-reloads via the mount above.

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.frontend
      target: dev
    restart: unless-stopped
    env_file: .env
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3001/api
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ./apps/frontend/src:/workspace/apps/frontend/src
      - ./apps/frontend/public:/workspace/apps/frontend/public

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - frontend

volumes:
  postgres_data:
  localstack_data:
