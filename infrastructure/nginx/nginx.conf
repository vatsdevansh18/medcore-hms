worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include mime.types;
  default_type application/octet-stream;
  sendfile on;

  # Basic edge rate limiting — see docs/09-SECURITY.md SEC-NET-003.
  # Nginx only accepts r/s or r/m, not arbitrary windows — this is a coarse
  # edge guard; the app-level Redis throttler (Phase 3) enforces the exact
  # "100 req/15 min on auth" policy from the brief.
  limit_req_zone $binary_remote_addr zone=api_general:10m rate=1000r/m;
  limit_req_zone $binary_remote_addr zone=api_auth:10m rate=7r/m;

  upstream frontend_upstream {
    server frontend:3000;
  }

  upstream api_upstream {
    server api:3001;
  }

  server {
    listen 80;
    server_name localhost;

    location /api/auth/ {
      limit_req zone=api_auth burst=20 nodelay;
      proxy_pass http://api_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
      limit_req zone=api_general burst=50 nodelay;
      proxy_pass http://api_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
      proxy_pass http://api_upstream;
    }

    location /socket.io/ {
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
    }

    location / {
      proxy_pass http://frontend_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
