worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include mime.types;
  default_type application/octet-stream;
  sendfile on;

  # Same coarse edge guard as the dev config (docs/09-SECURITY.md SEC-NET-003)
  # — the app-level Redis throttler is still the source of truth for the
  # exact "100 req/15 min on auth" policy; this only protects Nginx itself
  # from being overwhelmed before a request even reaches the app.
  limit_req_zone $binary_remote_addr zone=api_general:10m rate=1000r/m;
  limit_req_zone $binary_remote_addr zone=api_auth:10m rate=7r/m;

  # `upstream.conf` holds one line — `server <container>:3001;` — and is
  # bind-mounted read-write from the host (docker-compose.prod.yml), so
  # scripts/deploy/blue-green.sh can flip which container is live by
  # rewriting it and running `nginx -s reload`, without touching this file.
  upstream api_upstream {
    include /etc/nginx/conf.d/upstream.conf;
  }

  # CHANGE "api.yourdomain.example" to your real domain in both server
  # blocks below before deploying (docs/13-DEPLOYMENT-RUNBOOK.md). The
  # frontend is on Vercel, on its own domain — this Nginx serves the API
  # only, per docs/03-ARCHITECTURE.md §11 (Vercel --REST+WS--> EC2 is a
  # cross-origin call, not a same-origin proxy).

  # ACME HTTP-01 challenge (Certbot) and an HTTP->HTTPS redirect for
  # everything else — plain HTTP never reaches the API (SEC-DATA-002).
  server {
    listen 80;
    server_name api.yourdomain.example;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name api.yourdomain.example;

    ssl_certificate     /etc/letsencrypt/live/api.yourdomain.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /api/auth/ {
      limit_req zone=api_auth burst=20 nodelay;
      proxy_pass http://api_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
      limit_req zone=api_general burst=50 nodelay;
      proxy_pass http://api_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
      proxy_pass http://api_upstream;
    }

    # Health probe for the blue-green cutover script and any container
    # orchestrator — kept out of /api/ so it's never rate-limited by the
    # api_general zone above (scripts/deploy/blue-green.sh polls this often).
    location /health/ready {
      proxy_pass http://api_upstream;
    }

    location /socket.io/ {
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
    }
  }
}
