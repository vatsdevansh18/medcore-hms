name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 9.15.4
  NODE_VERSION: 20

jobs:
  lint-typecheck-build:
    name: Lint, type-check & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type-check
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The frontend's component tests import @medcore/types as compiled JS.
      - name: Build shared types
        run: pnpm --filter=@medcore/types run build

      - name: Run unit and component tests
        run: pnpm run test

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: medcore_hms_test
          POSTGRES_USER: medcore
          POSTGRES_PASSWORD: medcore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medcore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Attachment/upload specs (medical-records, portal, onboarding-schedule)
      # round-trip real bytes through S3 and check the dev bucket's CORS rule
      # (docs/11-DECISIONS.md D-015/D-042) — without this service those specs
      # fail with connection errors, not skips.
      localstack:
        image: localstack/localstack:3
        env:
          SERVICES: s3
          DEFAULT_REGION: ap-south-1
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ts-node (`prisma migrate deploy` isn't affected, but the e2e run
      # below is) resolves @medcore/types as compiled JS, not raw TS — its
      # dist/ is gitignored and does not exist on a fresh checkout.
      - name: Build shared types
        run: pnpm --filter=@medcore/types run build

      - name: Apply database migrations
        working-directory: apps/backend
        env:
          DATABASE_URL: postgresql://medcore:medcore@localhost:5432/medcore_hms_test
        run: pnpm exec prisma migrate deploy

      - name: Run integration (e2e) tests
        working-directory: apps/backend
        env:
          DATABASE_URL: postgresql://medcore:medcore@localhost:5432/medcore_hms_test
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
          CORS_ORIGIN: http://localhost:3000
          # CI-only dummy secrets (never real credentials) — required by
          # src/config/env.validation.ts with no default, so the app fails
          # closed at boot without them rather than falling back insecurely.
          JWT_ACCESS_SECRET: 6deb9c230925452355b48dace7cc7f2012edbc27e459ff40999e5aab90225249
          ENCRYPTION_KEY: 8c721df8b2b59ebd90d8a4fe398d2ad5c6713ce6489f671bfc37bf72a8000704
          AWS_REGION: ap-south-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_S3_BUCKET: medcore-hms-attachments
          S3_ENDPOINT: http://localhost:4566
        run: pnpm exec jest --config ./test/jest-e2e.json
